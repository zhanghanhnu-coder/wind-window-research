<svg xmlns="http://www.w3.org/2000/svg" width="182mm" height="139.23mm" viewBox="0 0 1000 765"><title>Joint forecasting, window probability and resource-constrained execution</title>
<desc>Implemented mechanism. (a) Fixed-neighbor aggregation and a gated causal temporal encoder map 24 h of three-channel observations to 19 ordered hourly-maximum proxy values per turbine. Calibration and historical residual-rank coupling produce 57 equally weighted joint paths. (b) At a task start, p is the fraction of paths satisfying the threshold at every required hour; the three-path, six-hour example is illustrative, not a measured forecast. Actual task durations are 6 or 12 h. (c) Over the feasible task/start choices, planning maximizes the sum of expected avoided task penalties minus task costs, respecting fixed resource and turbine constraints; only current starts are committed and planning repeats every 6 h. (d) Dashed links use outcome evidence for retrospective evaluation only. Missing truth yields identification bounds, not confidence intervals. Threshold units remain unverified.</desc>
